; AnimSpeedFix - place next to dinput8.dll (i.e. next to Wow.exe).
;
; 3.3.5a scales movement animation playback by your real speed, so speed buffs
; make you pedal your feet faster. Vanilla 1.12 didn't - you glided. This locks
; playback at 1.0x for the animations listed below and leaves everything else
; (mounts, running, swimming, ...) on stock behaviour.

[AnimSpeed]
Enabled = 1

; If the patch can't be applied (e.g. a different Wow.exe build), the reason is
; always appended to AnimSpeedFix.log next to the DLL. Set ShowErrors = 1 to
; also get a pop-up. Left at 0 for distribution, so a bad build is quiet rather
; than throwing a modal in every player's face on every launch.
ShowErrors = 0

; Animation IDs locked at 1.0x playback. Comma or space separated.
;
; Default is stealth only:
;    119 = StealthWalk
;    223 = StealthRun
;
; Only animations the engine treats as movement animations can scale at all,
; so only these are worth listing:
;    4 Walk        5 Run         11 ShuffleLeft   12 ShuffleRight
;   13 Walkbackwards            37 JumpStart      38 Jump
;   39 JumpEnd    42 Swim       43 SwimLeft       44 SwimRight
;   45 SwimBackwards           119 StealthWalk   135 Fly
;  143 Sprint    187 JumpLandRun            223 StealthRun
;
; (StealthStand 120 and the FlyStealth* variants are not movement animations,
;  so they never scale and listing them does nothing.)

LockAnimations = 119, 223

; ---------------------------------------------------------------------------
; [SwingGuard] - stop spell animations from eating melee swings.
;
; Proven with slot logging: attack and spell animations are written to the SAME
; animation track, so whichever lands second destroys the first. Measured over
; 12 packet-driven swings:
;
;   SpellCastDirected  +0.19 .. 0.69 ms   4 swings  <- same frame, never renders
;   Walkbackwards      +41 ms, +278 ms    2 swings  <- ordinary interrupt
;   Run                +87 ms             1 swing   <- ordinary interrupt
;
; Only the same-frame case is a bug: the swing is destroyed before a single
; frame draws it. A swing cut short 40-280 ms in has already been seen, and
; suppressing movement to "save" it would freeze the character mid-stride.
;
; So the rule is animation-agnostic and deliberately tight: anything that would
; take an attack animation's place within ProtectMs is dropped. That covers any
; spell landing on the same frame, not just Flametongue.
;
; ProtectMs: about one rendered frame. 20 ms suits 60 fps. Raising it far above
; a frame time starts eating legitimate movement interrupts.
;
; NeverSuppress: animations that must always win - death, knockdown, stun.
; ---------------------------------------------------------------------------
; This whole file is OPTIONAL. The DLL ships without one and both fixes are ON
; by default; the ini exists only to turn them off or tune them.
[SwingGuard]
Enabled       = 1
ProtectMs     = 20
AttackAnims   = 16,17,18,19,46,49,85,86,87,88,107,117,482
NeverSuppress = 0,1,6,7,14,466,467

; --- the late re-issue ------------------------------------------------------
; A second, separate problem, present with SwingGuard off too (so it is stock
; client behaviour, not caused by this DLL):
;
; While moving, the client puts the swing on slot 3 - which is the track that
; actually renders in that case - and then re-issues the SAME swing on slot 0
; about 180-215 ms later. Measured: +210.7, +183.1, +214.1 ms. That second
; issue is the spurious "flush" swing.
;
; DropSlot3Replay drops that duplicate and leaves the correctly-timed slot-3
; swing alone. ReplayMs is how long after a slot-3 swing a repeat counts as a
; duplicate; measured delays are 183-214 ms, so 300 has margin while staying
; well under any genuine second swing.
DropSlot3Replay = 1
ReplayMs        = 300

; ForceAttackSlot0 was the opposite experiment - redirect the swing to slot 0.
; MEASURED WORSE: slot 3 is where an attack-while-moving actually renders, so
; forcing it to slot 0 puts it where Run/Shuffle immediately overwrites it and
; strafing suppresses attacks entirely. Kept only to re-test; leave at 0.
ForceAttackSlot0 = 0

; ---------------------------------------------------------------------------
; [Trace] - diagnostics. Off by default; costs nothing when disabled.
; With Trace on, every suppressed animation is logged as a DROP record.
;
; Logs, on one high-resolution clock:
;   OP    every opcode the client dispatches   (hook at 0x632013)
;   ANIM  every CM2Model::PlayAnimation call   (hook at 0x832AB0)
;
; This answers "was the attack packet late, or was the swing animation held?".
; If SMSG_ATTACKERSTATEUPDATE (0x14A) and the proc opcode land microseconds
; apart but the swing's ANIM record is ~a swing-timer later, the network is
; fine and the animation is being deferred.
;
; Tracing is independent of the gameplay patch above - set
; [AnimSpeed] Enabled = 0 to trace with this DLL otherwise inert.
;
; Read the CSV with:  python tracefmt.py AnimTrace.csv
;
; Records flush every 32KB, so kill the client and you lose the tail; exit it
; normally to get everything.
; ---------------------------------------------------------------------------
; Slots logs the sequence-setter at 0x826C40 (model, sequence, SLOT index).
; That is what proves whether two animations share a track - i.e. whether one
; can actually overwrite the other. Run this with SwingGuard DISABLED, or the
; suppression hides the very collision you are trying to observe.
[Trace]
Enabled    = 1
Opcodes    = 1
Animations = 1
Slots      = 1
File       = AnimTrace.csv

; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
; [PlayerCollide] - buff-gated player-vs-player collision.
;
; Every value here is ALREADY the compiled default, so the shipped DLL behaves
; exactly like this with no ini present at all. This file exists to change the
; tuning or to switch the feature off.
;
; How it works: movement in 3.3.5 is client-authoritative, so each client clips
; its OWN movement against nearby players - that is the whole mechanic, and it
; propagates to everyone through the normal position heartbeats. The clip happens
; before the client applies the movement, so an illegal position is never
; produced. Remote players' interpolation is clipped too, so they stop at a body
; instead of oscillating through it.
;
; Server-side companions (not configured here): playerbots are stopped by the
; worldserver, and PlayerCollision.GlobalAura in worldserver.conf can put a
; collision aura on everyone automatically.
; ---------------------------------------------------------------------------
[PlayerCollide]
Enabled       = 1
Native        = 1     ; clip the movement delta before the client applies it.
                      ; 0 = the old position-correcting mode; do not use it, it
                      ; cannot be made reliable (see PLAYER_COLLISION_DESIGN.md).

; --- which auras switch collision on (0 = that rule is off) ---
; Two axes: WHO is affected, and one-way vs mutual. All decided by YOUR client,
; which only ever clips your own movement:
;   SpellBlockEnemies   on them: their enemies can't pass them (they still pass you)
;   SpellBlockAll       on them: nobody can pass them          (they still pass you)
;   SpellCollideEnemies on either: mutual collision with their enemies
;   SpellCollideAll     on either: mutual collision with everyone
SpellBlockEnemies   = 90210   ; Obstruction
SpellBlockAll       = 90211   ; Immovable
SpellCollideEnemies = 90212   ; Bodycheck
SpellCollideAll     = 90213   ; Solid Form
SpellId             = 0       ; legacy single-spell mode, off

; --- feel ---
Radius        = 0.75  ; per-player radius; you block at 2x this (1.5 yd apart).
Sides         = 0     ; collision shape, fixed to the world axes (never rotates):
                      ;   0 = circle   - smooth
                      ;   4 = square   - 4 flat faces, hard corners
                      ;   8 = octagon  - between the two
                      ; For polygons Radius is the HALF-WIDTH, so they reach
                      ; ~1.41x further corner-on. A circle is uniform.
Height        = 1.4   ; vertical extent of the body. Collision only applies while
                      ; |dz| is under this, so you do not collide with someone on
                      ; the floor above or flying overhead. 1.4 is deliberately
                      ; BELOW a player's ~1.6 yd jump apex, so you CAN jump over
                      ; someone. Raise above ~1.6 to make bodies unjumpable.
ContactBand   = 0     ; how far past Radius still counts as "touching" for the
                      ; purposes of SlideFriction.
SlideFriction = 0.5   ; how much speed survives sliding along someone while
                      ; pressing into them. 0 = stop dead, 1 = frictionless.
BothNeedBuff  = 1     ; legacy-mode only: both parties need SpellId.

SyncPredicted = 1     ; REQUIRED. The client builds its movement target from a
                      ; predicted position; holding you back without correcting
                      ; that base lets the gap accumulate and discharge as a
                      ; teleport the moment the way clears. Setting this to 0 was
                      ; measured to bring the teleport straight back.

ShowErrors    = 0     ; 1 = pop up if a client signature stops matching. Failures
                      ; are always written to AnimSpeedFix.log regardless.
Debug         = 0     ; 1 = sampled diagnostics, 2 = every frame (very verbose).
                      ; The `clip` lines are what diagnosed every issue so far:
                      ; dist vs contact, and in= vs out= per frame.
